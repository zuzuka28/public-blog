project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  preview:
    port: 4242
    browser: true

lang: ru

website:
  title: "zuzuka28 / заметки"
  description: "Здесь водятся драконы."
  site-url: "https://zuzuka28.github.io/public-blog"
  repo-url: "https://github.com/zuzuka28/public-blog"
  repo-actions: [source, issue]
  favicon: assets/github-profile.jpg
  image: assets/social-card.png
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    pinned: true
    logo: assets/mark.svg
    logo-alt: "Знак блога: буква Z"
    left:
      - href: index.qmd
        text: Главная
      - href: updates.qmd
        text: Обновления
      - href: about.qmd
        text: Обо мне
    right:
      - icon: github
        href: "https://github.com/zuzuka28"
        aria-label: GitHub
  page-footer:
    left: "© 2026 zuzuka28. Текст и код собраны с помощью Quarto."
    right:
      - text: "Исходники"
        href: "https://github.com/zuzuka28/public-blog"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, styles.scss]
      dark: [cosmo, theme-dark.scss, styles.scss]
    respect-user-color-scheme: true
    toc: true
    toc-location: right
    smooth-scroll: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    anchor-sections: true
    fig-cap-location: bottom
    link-external-newwindow: true

execute:
  freeze: auto
